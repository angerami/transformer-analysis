# Pipeline configuration for transformer-analysis
# Override any value at runtime: snakemake --config key=value

# ── Output and cache paths ────────────────────────────────────────────────────
# Override at runtime via OUTPUT_DIR / CACHE_DIR env vars (point CACHE_DIR at a
# big external volume to avoid re-downloading model weights):
#   OUTPUT_DIR=/mnt/drive/ana-005 CACHE_DIR=/mnt/drive/downloads snakemake -j8
# mlruns/ is always placed inside output_dir so runs and datasets travel together.
output_dir: outputs
cache_dir: downloads

# ── MLflow tracking ───────────────────────────────────────────────────────────
# mlflow_uri is derived from output_dir in the Snakefile; no need to set it here.
mlflow_experiment: ana-006-open-production

# ── Models and revisions ──────────────────────────────────────────────────────
# Each entry under "runs" defines one (model, revision) pair to process.
# Snakemake expands these into parallel primary + transform jobs.
#
# "revision: null" means the default branch (main/latest).
#
# For dev runs, override at the command line:
#   snakemake --config runs='[{model: gpt2, revision: null}]' -j2

runs:
  - model: gpt2
    revision: null
  - model: gpt2-medium
    revision: null
  - model: gpt2-large
    revision: null
  - model: gpt2-xl
    revision: null

  - model: pythia-70m-deduped
    revision: step143000
  - model: pythia-160m-deduped
    revision: step143000
  - model: pythia-410m-deduped
    revision: step143000
  - model: pythia-1b-deduped
    revision: step143000
  - model: pythia-1.4b-deduped
    revision: step143000
  - model: pythia-2.8b-deduped
    revision: step143000
  - model: pythia-6.9b-deduped
    revision: step143000
  - model: pythia-12b-deduped
    revision: step143000

  - model: llama-3.1-8b
    revision: null
  - model: mistral-7b-v0.3
    revision: null

  - model: olmo2-1b
    revision: null
  - model: olmo2-7b
    revision: null
  - model: olmo2-13b
    revision: null
  - model: olmo2-32b
    revision: null

  - model: llama3.2-1b
    revision: null
  - model: llama3.2-3b
    revision: null

  - model: gemma2-2b
    revision: null
  - model: gemma2-9b
    revision: null

  - model: smollm2-135m
    revision: null
  - model: smollm2-360m
    revision: null
  - model: smollm2-1.7b
    revision: null

# ── Named targets ─────────────────────────────────────────────────────────────
# Subsets of runs that can be driven independently:
#   snakemake target_gpt2_family -j4
#   snakemake target_pythia_family -j4
#   snakemake target_llama_family -j4
#   snakemake target_all -j8
#
# For a full Pythia checkpoint sweep of one model:
#   snakemake target_pythia_70m_steps -j4
# Runs listed here must also appear in runs: above.

targets:
  gpt2_family:
    - model: gpt2
      revision: null
    - model: gpt2-medium
      revision: null
    - model: gpt2-large
      revision: null
    - model: gpt2-xl
      revision: null

  pythia_family:
    - model: pythia-70m-deduped
      revision: step143000
    - model: pythia-160m-deduped
      revision: step143000
    - model: pythia-410m-deduped
      revision: step143000
    - model: pythia-1b-deduped
      revision: step143000
    - model: pythia-1.4b-deduped
      revision: step143000
    - model: pythia-2.8b-deduped
      revision: step143000
    - model: pythia-6.9b-deduped
      revision: step143000
    - model: pythia-12b-deduped
      revision: step143000

  llama_family:
    - model: llama-3.1-8b
      revision: null
    - model: mistral-7b-v0.3
      revision: null

  olmo2_family:
    - model: olmo2-1b
      revision: null
    - model: olmo2-7b
      revision: null
    - model: olmo2-13b
      revision: null
    - model: olmo2-32b
      revision: null

  llama32_family:
    - model: llama3.2-1b
      revision: null
    - model: llama3.2-3b
      revision: null

  gemma2_family:
    - model: gemma2-2b
      revision: null
    - model: gemma2-9b
      revision: null

  smollm2_family:
    - model: smollm2-135m
      revision: null
    - model: smollm2-360m
      revision: null
    - model: smollm2-1.7b
      revision: null

# ── Pythia checkpoint sweeps (per-model, all training steps) ─────────────────
# Each entry generates a target_pythia_{shortname}_steps rule covering all
# PYTHIA_REVISIONS for that model. Runs must be added to runs: above first.
# e.g. to run: snakemake target_pythia_70m_steps -j4
pythia_steps: []
# pythia_steps:
#   - model: pythia-70m-deduped
#     shortname: 70m
#   - model: pythia-160m-deduped
#     shortname: 160m

# ── Analysis options ──────────────────────────────────────────────────────────
max_workers: 4          # threads for weight extraction
device: null            # null = auto-detect (cpu/cuda/mps)
cleanup_downloads: false  # delete model weights after processing
weight_types:
  - W_Q
  - W_K
  - W_QK
  # - W_Q_gram
  # - W_K_gram
  # - QK_alignment

# Get W_Q/W_K's U,S for the factored W_QK SVD from the d_head×d_head Gram
# eigendecomposition instead of a wide d_head×d_model SVD (avoids the MPS→CPU
# svd fallback; large speedup on big models). Exact for S_WQK. Off by default.
svd_via_gram: false

# ── Transform options ─────────────────────────────────────────────────────────
# drop_columns: strip these columns from the refined dataset to reduce file size.
# The primary dataset is never touched, so columns can always be recovered by
# re-running --forcerun transform with an empty list.
# Common candidates when dashboards slow down: P_w (raw histogram), w_bins
transform:
  drop_columns: []

# ── Merge configuration ───────────────────────────────────────────────────────
# cross_model: incrementally merge all config runs into one dataset.
#   New models are appended; existing ones are skipped unless listed in refresh.
#   Set enabled: false to skip this stage.
#
# checkpoints: for each entry, collapse all revisions of one model into a
#   single dataset (e.g. all 154 Pythia checkpoints → one HF Dataset).

merge:
  cross_model:
    enabled: true
    out_name: all_models           # outputs/{out_name} is the merged dataset
    refresh: []                    # model names to force-replace even if present

  checkpoints: []                  # e.g. [pythia-70m-deduped, pythia-160m-deduped]

# ── Correlation analysis ──────────────────────────────────────────────────────
correlation:
  circuits: [QK]
  metrics:
    - frob_cosine
    - pearson_corr
    - hist_jensen_shannon
  equilibrium: false               # also compute QK/OV equilibrium observables per head

# ── Ultrametricity (triple + clustering diagnostics on Q_hh) ───────────────────
ultrametricity:
  metrics:
    - frob_cosine
    - hist_jensen_shannon
  sample_cap: 2000000
  quad_sample_cap: 1000000
  max_dense: 3000
  tol: 0.05
  seed: 0

# ── Eval / perplexity ─────────────────────────────────────────────────────────
# Optional stage; not in the default `all` target.
# Run with: snakemake eval_all -j1  (must be -j1; output parquet is shared)
#
# corpus: wikitext103 or pile
# pile_cache: path to a pre-materialized corpus from prepare_eval_corpus.py
eval:
  corpus: wikitext103
  pile_tokens: 204800
  pile_cache: null
  # out is derived from output_dir + mlflow_experiment in the Snakefile
